name: OpenSidecar
options:
  createIntermediateGroups: true
# Swift Package Manager dependencies. Sparkle powers the macOS app's
# out-of-store auto-update (issue #52); it's an embedded open-source
# framework + CLI tooling, not a hosted service — the appcast feed and the
# DMG are served from infrastructure we already own (GitHub Pages + Releases).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.x is the current major (latest 2.9.x) and the first Sparkle line to
    # support SPM. `from:` allows compatible 2.x updates.
    from: "2.6.0"
schemes:
  OpenSidecarMac:
    build:
      targets:
        OpenSidecarMac: all
    test:
      targets:
        - OpenSidecarMacTests
  OpenSidecariOS:
    build:
      targets:
        OpenSidecariOS: all
  OpenSidecarMacReceiver:
    build:
      targets:
        OpenSidecarMacReceiver: all
# DEVELOPMENT_TEAM comes from the environment (see generate.sh / .env) so no
# personal team ID lives in the repo. Unset = unsigned, fine for CI.
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    # Version defaults for local builds. CI overrides both via xcargs:
    # MARKETING_VERSION from the release tag, CURRENT_PROJECT_VERSION from
    # the GitHub Actions run number (monotonic, keeps TestFlight builds unique).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSidecarMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
      - Shared
    dependencies:
      - package: Sparkle
    info:
      path: Mac/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSLocalNetworkUsageDescription: OpenDisplay connects to your iPad or iPhone over the local network in WiFi mode.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # --- Sparkle auto-update (issue #52) ---
        # The appcast feed is hosted on the landing-page site at the custom
        # domain. The release workflow publishes appcast.xml so this URL
        # resolves — see .github/workflows/release.yml.
        SUFeedURL: https://opendisplay.app/appcast.xml
        # Public EdDSA key from Sparkle's `generate_keys`. The matching private
        # key lives only as the `SPARKLE_PRIVATE_KEY` GitHub Actions secret
        # (used to sign the appcast in CI) and is never committed. Sparkle
        # verifies update signatures against this public key before installing.
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        # Check for updates automatically in the background on a schedule.
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac
        PRODUCT_NAME: OpenDisplay
        BUNDLE_DISPLAY_NAME: OpenDisplay
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Mac/OpenSidecarMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Local dev builds get their own identity: TCC keys permission
        # grants by bundle ID + code signature, so a Debug build sharing
        # the release bundle ID knocks out the release app's Screen
        # Recording/Accessibility grants every time the binary changes.
        # PRODUCT_NAME (not BUNDLE_DISPLAY_NAME) is what the permission
        # lists show, so the Debug build must override it to appear as its
        # own row instead of a second, indistinguishable "OpenDisplay".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.debug
          PRODUCT_NAME: OpenDisplay Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Dev
          # Colour-inverted icon so the dev build is obvious in the Dock,
          # cmd-tab and permission lists.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  # The standalone receiver app (issues #82/#17/#241): a spare Mac as a
  # display. Deliberately its own bundle with a much lower deployment target
  # than the sender, which is pinned to 14 by its capture stack. Everything
  # under Shared/ and the files listed from Mac/ must therefore compile at
  # this floor; keep this the oldest macOS the receiver path supports.
  OpenSidecarMacReceiver:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - MacReceiver
      - Shared
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Mac/CheckForUpdatesView.swift
    dependencies:
      - package: Sparkle
    info:
      path: MacReceiver/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: $(BUNDLE_DISPLAY_NAME)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: OpenDisplay Receiver advertises itself on the local network so another Mac can connect and use this Mac as a display.
        NSBonjourServices: ["_opensidecar._tcp"]
        LSApplicationCategoryType: public.app-category.utilities
        # Own Sparkle feed (separate DMG, same signing key); published by
        # release.yml next to the sender's appcast.
        SUFeedURL: https://opendisplay.app/appcast-receiver.xml
        SUPublicEDKey: rYxlIePmwzi2bRo/qIsuY2TqTnQ34li2gQhJpGBiumw=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver
        PRODUCT_NAME: OpenDisplay Receiver
        BUNDLE_DISPLAY_NAME: OpenDisplay Receiver
        # Log.swift's file locking helpers live in the C bridging header.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MacReceiver/OpenSidecarMacReceiver.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.mac.receiver.debug
          PRODUCT_NAME: OpenDisplay Receiver Dev
          BUNDLE_DISPLAY_NAME: OpenDisplay Receiver Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
  OpenSidecarMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacTests
      - Mac/DisplayArrangement.swift
      - Mac/Log.swift
      - Mac/LogPolicies.swift
      - Shared/LogSnapshot.swift
    settings:
      base:
        # A hostless test bundle: the sources under test are compiled straight
        # into it, so there is no app to inject into and nothing to load from.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        # Without this the bundle has no Info.plist and code signing refuses to
        # run, which fails the build before a single test executes.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Mac/OpenSidecarMac-Bridging-Header.h
  OpenSidecariOS:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - iOS
      - Shared
      # Only the app<->extension handoff contract — the rest of Broadcast/
      # compiles solely into the extension.
      - Broadcast/BroadcastTarget.swift
    dependencies:
      - target: OpenSidecarBroadcast
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: OpenDisplay
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: OpenDisplay advertises itself on the local network so your Mac can connect over WiFi.
        NSBonjourServices: ["_opensidecar._tcp"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App group shared with the broadcast extension (issue #123): the send
        # screen writes the chosen receiver there for the extension to dial.
        CODE_SIGN_ENTITLEMENTS: iOS/OpenSidecariOS.entitlements
  # iPad -> iPad screen mirroring (issue #123): a ReplayKit broadcast upload
  # extension is the only sanctioned whole-screen capture on iOS. It runs the
  # sender pipeline (capture -> H.264 -> framed TCP) against the existing
  # receiver app.
  OpenSidecarBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Broadcast
      - Shared/Protocol.swift
      - iOS/Log.swift
    info:
      path: Broadcast/Info.plist
      properties:
        # Shown in the system broadcast picker and Control Center.
        CFBundleDisplayName: OpenDisplay
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: OpenDisplay streams your screen to another iPad or iPhone over the local network.
        NSBonjourServices: ["_opensidecar._tcp"]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peetzweg.opensidecar.ios.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Broadcast/OpenSidecarBroadcast.entitlements
        SKIP_INSTALL: YES
